# ─────────────────────────────────────────────────────────────────────────────
# VitalsMed — application.properties
# TRITHREAD: Velayo, Gacrama, Tiro | v0.1.0 First Sprint
# ─────────────────────────────────────────────────────────────────────────────

spring.application.name=VitalsMed

# ── Database (H2 in-memory for dev/demo; swap for MySQL/PostgreSQL in prod) ──
spring.datasource.url=jdbc:h2:mem:vitalmeddb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ── JPA / Hibernate ──────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ── Server ────────────────────────────────────────────────────────────────────
server.port=8080

# ── Logging ───────────────────────────────────────────────────────────────────
logging.level.com.trithread.vitalmed=DEBUG

